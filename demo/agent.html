<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能体（被嵌入页）</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        display: flex;
        flex-direction: column;
        background: #fff;
        color: #0f172a;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        font-weight: 600;
        font-size: 14px;
      }
      .thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .bubble { max-width: 80%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
      .bubble.agent { background: #eff6ff; color: #1e3a8a; align-self: flex-start; }
      .bubble.user { background: #2563eb; color: #fff; align-self: flex-end; }
      footer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid rgba(15, 23, 42, 0.08); }
      input {
        flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(15, 23, 42, 0.16);
        font: inherit; outline: none;
      }
      input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
      button {
        padding: 10px 16px; border-radius: 10px; border: 0; background: #2563eb; color: #fff;
        font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>小助手 · 被嵌入的智能体页面</header>
    <div class="thread" id="thread">
      <div class="bubble agent">你好，我是被嵌在 iframe 里的智能体页面。这个页面只用来验证插件行为。</div>
    </div>
    <footer>
      <input id="text" placeholder="随便说点什么…" />
      <button id="send">发送</button>
    </footer>
    <script>
      const thread = document.getElementById('thread')
      const input = document.getElementById('text')

      function append(role, text) {
        const div = document.createElement('div')
        div.className = 'bubble ' + role
        div.textContent = text
        thread.appendChild(div)
        thread.scrollTop = thread.scrollHeight
      }

      function send() {
        const text = input.value.trim()
        if (!text) return
        append('user', text)
        input.value = ''
        setTimeout(() => append('agent', '收到：' + text), 300)
      }

      document.getElementById('send').addEventListener('click', send)
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') send()
      })
    </script>
  </body>
</html>
